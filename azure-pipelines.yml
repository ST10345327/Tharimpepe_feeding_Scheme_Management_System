trigger:
  branches:
    include:
      - main
      - feature/*
      - backend/*
      - frontend/*
      - shared/*

pr:
  branches:
    include:
      - main

jobs:
  - job: PhpValidation
    displayName: PHP lint and tests
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_MAJOR_VERSION !== 8) { fwrite(STDERR, "PHP 8 is required.\n"); exit(1); }
          if (!extension_loaded("pdo_sqlite")) { fwrite(STDERR, "The pdo_sqlite extension is required by the test suite.\n"); exit(1); }'
        displayName: Check PHP runtime and SQLite driver

      - bash: |
          set -euo pipefail
          git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
        displayName: Lint tracked PHP files

      - bash: php tests/run_all_tests.php
        displayName: Run FSMS automated tests
        env:
          FSMS_TEST_SQLITE: '1'

  - job: AndroidDebugBuild
    displayName: Build Android debug APK
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail
          java -version
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" || {
            echo "Android SDK environment is not available on this agent." >&2
            exit 1
          }
          chmod +x ./gradlew
          ./gradlew assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
        workingDirectory: android
        displayName: Compile Android debug APK

      - task: PublishPipelineArtifact@1
        displayName: Publish Android debug APK
        inputs:
          targetPath: '$(Build.SourcesDirectory)/android/app/build/outputs/apk/debug/app-debug.apk'
          artifact: fsms-android-debug-apk
          publishLocation: pipeline
